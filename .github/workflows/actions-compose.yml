name: NoVNC Linux Container (fcwu)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-fcwu-novnc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start fcwu Ubuntu VNC Desktop Container
        run: |
          # Pull and run the fcwu desktop container mapping port 6080
          docker run -d \
            --name novnc-container \
            -p 6080:6080 \
            -v /dev/shm:/dev/shm \
            fcwu/docker-ubuntu-vnc-desktop:latest

      - name: Create Local NoVNC HTML Page
        run: |
          # Create directory for the webpage
          mkdir -p public_html
          
          # Generate the HTML landing page pointing to port 6080
          cat << 'EOF' > public_html/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>NoVNC Container Access - fcwu</title>
              <style>
                  body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 50px; }
                  .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
                  a.btn { background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 15px; }
                  a.btn:hover { background: #0056b3; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2>fcwu Ubuntu VNC Desktop Gateway</h2>
                  <p>The container environment is active.</p>
                  <a class="btn" href="http://localhost:6080" target="_blank">Open NoVNC Interface</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload HTML Page as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novnc-html-page
          path: public_html/index.html
