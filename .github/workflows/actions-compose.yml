name: NoVNC Linux Container (Fork)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image Locally
        run: |
          # Build the Docker image from the local Dockerfile in your forked repo
          docker build -t local-ubuntu-vnc .

      - name: Start Built Container
        run: |
          # Run your locally built container mapping port 6080
          docker run -d \
            --name novnc-container \
            -p 6080:6080 \
            -v /dev/shm:/dev/shm \
            local-ubuntu-vnc:latest

      - name: Create Local NoVNC HTML Page
        run: |
          mkdir -p public_html
          cat << 'EOF' > public_html/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>NoVNC Container Access</title>
              <style>
                  body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 50px; }
                  .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
                  a.btn { background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 15px; }
                  a.btn:hover { background: #0056b3; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2>Local Fork NoVNC Gateway</h2>
                  <p>Your custom container environment is active.</p>
                  <a class="btn" href="http://localhost:6080" target="_blank">Open NoVNC Interface</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload HTML Page as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novnc-html-page
          path: public_html/index.html
